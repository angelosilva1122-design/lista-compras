<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Compras">
  <meta name="theme-color" content="#ffffff" id="theme-color-meta">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Compras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <!-- MAIN SCREEN -->
    <div id="screen-main" class="screen active">
      <div class="topbar" id="topbar">
        <div class="topbar-inner">
          <h1>Compras</h1>
          <div class="topbar-actions">
            <button class="icon-btn" id="btn-supermarket" aria-label="Modo supermercado" aria-pressed="false">
              <svg id="icon-cart" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
            </button>
            <button class="icon-btn" id="btn-settings" aria-label="Definições">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="progress-wrap" id="progress-wrap" style="display:none">
          <div class="progress-info">
            <span class="progress-text" id="progress-text">0 de 0 apanhados</span>
            <span class="progress-pct" id="progress-pct">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" placeholder="Pesquisar produto" autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="search-clear" id="search-clear" aria-label="Limpar pesquisa">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <div class="list-scroll" id="list-scroll">
        <div id="list-container"></div>
        <div class="safe-area-bottom"></div>
      </div>

      <!-- BOTTOM BAR -->
      <div class="bottombar">
        <button class="bottom-btn" id="btn-add-product" aria-label="Adicionar produto">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
          <span>Produto</span>
        </button>
        <div class="bottombar-sep"></div>
        <button class="bottom-btn" id="btn-add-cat" aria-label="Nova categoria">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            <line x1="12" y1="11" x2="12" y2="17"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
          <span>Categoria</span>
        </button>
      </div>
    </div>

    <!-- SETTINGS SCREEN -->
    <div id="screen-settings" class="screen">
      <div class="settings-topbar">
        <button class="back-btn" id="btn-back-settings" aria-label="Voltar">
          <svg width="10" height="17" viewBox="0 0 10 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 1 1 8.5 9 16"/></svg>
          Voltar
        </button>
        <h2>Definições</h2>
        <div style="width:70px"></div>
      </div>
      <div class="settings-body">

        <div class="s-section">
          <div class="s-section-label">Tema</div>
          <div class="s-card">
            <div class="theme-row">
              <button class="theme-btn active" data-theme="light" id="th-light">Claro</button>
              <button class="theme-btn" data-theme="dark" id="th-dark">Escuro</button>
              <button class="theme-btn" data-theme="auto" id="th-auto">Automático</button>
            </div>
          </div>
        </div>

        <div class="s-section">
          <div class="s-section-label">Preferências</div>
          <div class="s-card">
            <div class="s-row" id="row-expand">
              <span class="s-row-label">Categorias expandidas por defeito</span>
              <button class="toggle" id="tog-expand" role="switch" aria-checked="true"></button>
            </div>
            <div class="s-row s-row-last" id="row-qty">
              <span class="s-row-label">Mostrar quantidade</span>
              <button class="toggle" id="tog-qty" role="switch" aria-checked="true"></button>
            </div>
          </div>
        </div>

        <div class="s-section">
          <div class="s-section-label">Dados</div>
          <div class="s-card">
            <button class="s-row s-row-danger" id="btn-clear-bought">
              <span class="s-row-label">Limpar produtos comprados</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <button class="s-row s-row-danger s-row-last" id="btn-clear-all">
              <span class="s-row-label">Limpar toda a lista</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </div>
        </div>

        <div class="app-version">Lista de Compras · v1.3.0</div>
        <div class="safe-area-bottom"></div>
      </div>
    </div>

  </div>

  <!-- QUICK ADD SHEET -->
  <div class="sheet-overlay" id="overlay-add">
    <div class="sheet" id="sheet-add" role="dialog" aria-label="Adicionar produto">
      <div class="sheet-handle"></div>
      <div class="sheet-content">
        <h3 class="sheet-title">Novo produto</h3>
        <div class="field-group">
          <input type="text" id="qa-input" placeholder="Nome do produto" autocomplete="off" autocorrect="off" maxlength="80">
        </div>
        <div class="field-group">
          <input type="text" id="qa-qty-input" placeholder="Quantidade (ex: 2 un, 500g) — opcional" autocomplete="off" maxlength="30">
        </div>
        <div class="field-group">
          <label class="field-label">Categoria <span class="optional">(obrigatório)</span></label>
          <div class="qa-cats" id="qa-cats" role="group" aria-label="Categoria"></div>
        </div>
        <div class="sheet-btns">
          <button class="btn-secondary" id="qa-cancel">Cancelar</button>
          <button class="btn-primary" id="qa-confirm">Adicionar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- EDIT PRODUCT SHEET -->
  <div class="sheet-overlay" id="overlay-edit">
    <div class="sheet" id="sheet-edit" role="dialog" aria-label="Editar produto">
      <div class="sheet-handle"></div>
      <div class="sheet-content">
        <h3 class="sheet-title">Editar produto</h3>
        <div class="field-group">
          <label class="field-label" for="edit-name">Nome</label>
          <input type="text" id="edit-name" placeholder="Nome do produto" autocomplete="off" maxlength="80">
        </div>
        <div class="field-group">
          <label class="field-label" for="edit-qty">Quantidade <span class="optional">(opcional)</span></label>
          <input type="text" id="edit-qty" placeholder="Ex: 2 un, 500g, 1L" autocomplete="off" maxlength="30">
        </div>
        <div class="field-group">
          <label class="field-label">Categoria</label>
          <div class="edit-cats" id="edit-cats" role="group"></div>
        </div>
        <div class="sheet-btns">
          <button class="btn-secondary" id="edit-cancel">Cancelar</button>
          <button class="btn-primary" id="edit-confirm">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ADD CATEGORY SHEET -->
  <div class="sheet-overlay" id="overlay-cat">
    <div class="sheet" id="sheet-cat" role="dialog" aria-label="Nova categoria">
      <div class="sheet-handle"></div>
      <div class="sheet-content">
        <h3 class="sheet-title">Nova categoria</h3>
        <div class="field-group">
          <input type="text" id="cat-input" placeholder="Ex: Frutas, Limpeza, Bebidas" autocomplete="off" maxlength="40">
        </div>
        <div class="sheet-btns">
          <button class="btn-secondary" id="cat-cancel">Cancelar</button>
          <button class="btn-primary" id="cat-confirm">Criar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- RENAME CATEGORY SHEET -->
  <div class="sheet-overlay" id="overlay-rename-cat">
    <div class="sheet" role="dialog" aria-label="Renomear categoria">
      <div class="sheet-handle"></div>
      <div class="sheet-content">
        <h3 class="sheet-title">Renomear categoria</h3>
        <div class="field-group">
          <input type="text" id="rename-cat-input" placeholder="Nome da categoria" autocomplete="off" maxlength="40">
        </div>
        <div class="sheet-btns">
          <button class="btn-secondary" id="rename-cat-cancel">Cancelar</button>
          <button class="btn-primary" id="rename-cat-confirm">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTEXT MENU (PRODUCTS) -->
  <div class="ctx-backdrop" id="ctx-backdrop"></div>
  <div class="ctx-menu" id="ctx-menu" role="menu">
    <button class="ctx-item" id="ctx-edit" role="menuitem">
      <span>Editar</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <div class="ctx-sep" id="ctx-prod-up-sep"></div>
    <button class="ctx-item" id="ctx-prod-up" role="menuitem">
      <span>Mover para cima</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
    <div class="ctx-sep" id="ctx-prod-down-sep"></div>
    <button class="ctx-item" id="ctx-prod-down" role="menuitem">
      <span>Mover para baixo</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="ctx-sep"></div>
    <button class="ctx-item ctx-danger" id="ctx-delete" role="menuitem">
      <span>Apagar</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </button>
  </div>

  <!-- CONTEXT MENU (CATEGORIES) -->
  <div class="ctx-menu" id="ctx-cat-menu" role="menu">
    <button class="ctx-item" id="ctx-cat-rename" role="menuitem">
      <span>Renomear</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="ctx-cat-up" role="menuitem">
      <span>Mover para cima</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="ctx-cat-down" role="menuitem">
      <span>Mover para baixo</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="ctx-sep"></div>
    <button class="ctx-item ctx-danger" id="ctx-cat-delete" role="menuitem">
      <span>Apagar</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </button>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
